name: Verify SIP-Fehleranalyse v1.6.7 release

on:
  push:
    branches:
      - release/publish-v1.6.7-public
    paths:
      - .github/workflows/verify-v1.6.7-release.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify public v1.6.7 release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release view v1.6.7 --repo "$GITHUB_REPOSITORY" --json tagName,name,isDraft,isPrerelease,url,assets > release.json
          python - <<'PY'
          import json
          data=json.load(open('release.json',encoding='utf-8'))
          assert data['tagName']=='v1.6.7'
          assert data['name']=='SIP-Fehleranalyse v1.6.7'
          assert not data['isDraft']
          assert not data['isPrerelease']
          names={a['name'] for a in data['assets']}
          required={
            'SIP-Fehleranalyse-v1.6.7-Setup.exe',
            'SIP-Fehleranalyse-v1.6.7-Portable.zip',
            'RELEASE-NOTES-v1.6.7.txt',
            'update-manifest.json',
            'update-manifest.sig',
            'SHA256SUMS.txt'
          }
          missing=required-names
          assert not missing, f'Missing release assets: {sorted(missing)}'
          print(data['url'])
          PY

      - name: Record verification
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          URL="$(python -c 'import json; print(json.load(open("release.json"))["url"])')"
          BODY="v1.6.7 public release verified successfully.\nRelease: $URL\nInstaller, portable package, release notes, signed update manifest and SHA256 list: OK\nVerified by GitHub Actions run $GITHUB_RUN_ID\n"
          CONTENT="$(printf '%b' "$BODY" | base64 -w0)"
          PATH_NAME="VERIFY-v1.6.7-PUBLISHED.txt"
          SHA="$(gh api "repos/$GITHUB_REPOSITORY/contents/$PATH_NAME?ref=release/publish-v1.6.7-public" --jq .sha 2>/dev/null || true)"
          ARGS=(-f message="Verify v1.6.7 public release" -f content="$CONTENT" -f branch="release/publish-v1.6.7-public")
          if [ -n "$SHA" ]; then ARGS+=(-f sha="$SHA"); fi
          gh api -X PUT "repos/$GITHUB_REPOSITORY/contents/$PATH_NAME" "${ARGS[@]}" >/dev/null
