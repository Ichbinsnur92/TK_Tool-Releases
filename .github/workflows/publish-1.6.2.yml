name: SIP-Fehleranalyse 1.6.2 Release verifizieren

on:
  push:
    branches:
      - 'publish/1.6.2'

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Öffentliches Release und Assets prüfen
        run: |
          set -euo pipefail
          gh release view v1.6.2 \
            --repo Ichbinsnur92/TK_Tool-Releases \
            --json tagName,name,isDraft,isPrerelease,assets \
            > release.json

          jq -e '.tagName == "v1.6.2" and .isDraft == false and .isPrerelease == false' release.json >/dev/null

          expected=$(cat <<'EOF'
          RELEASE-NOTES-v1.6.2.txt
          SHA256SUMS.txt
          SIP-Fehleranalyse-v1.6.2-Portable.zip
          SIP-Fehleranalyse-v1.6.2-Setup.exe
          update-manifest.json
          update-manifest.sig
          EOF
          )
          actual=$(jq -r '.assets[].name' release.json | sort)
          test "$actual" = "$(printf '%s\n' "$expected" | sort)"

          rm -rf verify-assets
          mkdir verify-assets
          gh release download v1.6.2 \
            --repo Ichbinsnur92/TK_Tool-Releases \
            --pattern 'update-manifest.json' \
            --pattern 'update-manifest.sig' \
            --pattern 'SHA256SUMS.txt' \
            --dir verify-assets

          grep -F '"appVersion":"1.6.2"' verify-assets/update-manifest.json
          grep -F '"fileName":"SIP-Fehleranalyse-v1.6.2-Setup.exe"' verify-assets/update-manifest.json
          grep -F '"fileName":"SIP-Fehleranalyse-v1.6.2-Portable.zip"' verify-assets/update-manifest.json

          cat > VERIFY-v1.6.2.txt <<'EOF'
          status=OK
          tag=v1.6.2
          draft=false
          prerelease=false
          assets=6
          installer=SIP-Fehleranalyse-v1.6.2-Setup.exe
          portable=SIP-Fehleranalyse-v1.6.2-Portable.zip
          update_manifest=1.6.2
          EOF

      - name: Prüfergebnis festhalten
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add VERIFY-v1.6.2.txt
          git commit -m 'Verify public v1.6.2 release [skip ci]'
          git push
