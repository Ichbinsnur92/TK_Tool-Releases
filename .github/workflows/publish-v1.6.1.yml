name: Publish SIP-Fehleranalyse 1.6.1

on:
  push:
    branches:
      - automation/publish-v1.6.1

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release repository
        uses: actions/checkout@v4

      - name: Download verified private build artifacts
        env:
          INSTALLER_ARTIFACT_URL: 'https://sdmntprukwest.oaiusercontent.com/files/00000000-08bc-8243-93a5-14fd03a9dd0a/raw?se=2026-08-18T20%3A27%3A19Z&sp=r&sv=2026-02-06&sr=b&scid=0ab119cc-3743-5c8c-a2ec-f2f358e4a7d8&skoid=5bfb38a5-43fb-4c63-80a1-6ae1e97e2e16&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-17T22%3A45%3A05Z&ske=2026-08-18T22%3A45%3A05Z&sks=b&skv=2026-02-06&sig=l51fFLN8IEDO/IhAl6l7I4izSPEuZfieag%2BgN7EyI/w%3D'
          PORTABLE_ARTIFACT_URL: 'https://sdmntprnortheu.oaiusercontent.com/files/00000000-680c-81f4-a344-d4d658379ea2/raw?se=2026-08-18T20%3A27%3A38Z&sp=r&sv=2026-02-06&sr=b&scid=024195d7-33c1-5e43-969e-0df01b9e07d7&skoid=5bfb38a5-43fb-4c63-80a1-6ae1e97e2e16&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-18T09%3A23%3A58Z&ske=2026-08-19T09%3A23%3A58Z&sks=b&skv=2026-02-06&sig=xHdeImJwnf9k%2BrSpJrM/F8cCHEMGtqbEc%2BOEFcWjF0E%3D'
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 "$INSTALLER_ARTIFACT_URL" -o installer-artifact.zip
          curl -L --fail --retry 3 "$PORTABLE_ARTIFACT_URL" -o SIP-Fehleranalyse-v1.6.1-Portable.zip
          unzip -j installer-artifact.zip 'SIP-Fehleranalyse-v1.6.1-Setup.exe' -d .
          unzip -p SIP-Fehleranalyse-v1.6.1-Portable.zip 'RELEASE-NOTES-v1.6.1.txt' > RELEASE-NOTES-v1.6.1.txt
          sha256sum SIP-Fehleranalyse-v1.6.1-Portable.zip SIP-Fehleranalyse-v1.6.1-Setup.exe > SHA256SUMS.txt

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v1.6.1 \
            SIP-Fehleranalyse-v1.6.1-Portable.zip \
            SIP-Fehleranalyse-v1.6.1-Setup.exe \
            RELEASE-NOTES-v1.6.1.txt \
            SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target main \
            --title 'SIP-Fehleranalyse 1.6.1' \
            --notes-file RELEASE-NOTES-v1.6.1.txt
