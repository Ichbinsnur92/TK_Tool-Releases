name: Verify SIP-Fehleranalyse v1.6.4 release

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/verify-v1.6.4-release.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Wait for and verify release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            if gh release view v1.6.4 --repo "$GITHUB_REPOSITORY" --json tagName,name,isDraft,isPrerelease,url,assets > release.json 2>/dev/null; then
              break
            fi
            sleep 10
          done
          test -s release.json
          python - <<'PY'
          import json
          data=json.load(open('release.json',encoding='utf-8'))
          assert data['tagName']=='v1.6.4'
          assert not data['isDraft']
          assert not data['isPrerelease']
          names={a['name'] for a in data['assets']}
          required={
            'SIP-Fehleranalyse-v1.6.4-Setup.exe',
            'SIP-Fehleranalyse-v1.6.4-Portable.zip',
            'RELEASE-NOTES-v1.6.4.txt',
            'SHA256SUMS.txt'
          }
          missing=required-names
          assert not missing, f'Missing release assets: {sorted(missing)}'
          print(data['url'])
          PY

      - name: Record verified publication
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          URL="$(python -c 'import json; print(json.load(open("release.json"))["url"])')"
          BODY="v1.6.4 public release verified successfully.\nRelease: $URL\nRequired assets: OK\nVerified by GitHub Actions run $GITHUB_RUN_ID\n"
          CONTENT="$(printf '%b' "$BODY" | base64 -w0)"
          PATH_NAME="VERIFY-v1.6.4-PUBLISHED.txt"
          SHA="$(gh api "repos/$GITHUB_REPOSITORY/contents/$PATH_NAME" --jq .sha 2>/dev/null || true)"
          ARGS=(-f message="Verify v1.6.4 public release" -f content="$CONTENT" -f branch=main)
          if [ -n "$SHA" ]; then ARGS+=(-f sha="$SHA"); fi
          gh api -X PUT "repos/$GITHUB_REPOSITORY/contents/$PATH_NAME" "${ARGS[@]}" >/dev/null
