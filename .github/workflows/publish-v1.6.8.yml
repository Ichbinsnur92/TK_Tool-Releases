name: Publish SIP-Fehleranalyse v1.6.8

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish-v1.6.8.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download validated v1.6.8 release assets
        shell: bash
        env:
          RELEASE_ASSETS_URL: "https://sdmntpritalynorth.oaiusercontent.com/files/00000000-63a8-8246-8970-be64238e93ed/raw?se=2026-08-22T09%3A35%3A20Z&sp=r&sv=2026-02-06&sr=b&scid=c2cbff64-93e9-5a68-b030-8e32865506ca&skoid=34268b52-5349-4f34-9be4-e38a5fb9f231&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-22T06%3A58%3A19Z&ske=2026-08-23T06%3A58%3A19Z&sks=b&skv=2026-02-06&sig=JGUfG1L9Wa1MMdiblLZhNPlek3qHXNOjPwv9TrCaEDk%3D"
        run: |
          set -euo pipefail
          rm -rf release unpack
          mkdir -p unpack
          curl -fL --retry 3 --retry-delay 2 "$RELEASE_ASSETS_URL" -o release-assets.zip
          unzip -q release-assets.zip -d unpack
          SETUP="$(find unpack -type f -name 'SIP-Fehleranalyse-v1.6.8-Setup.exe' -print -quit)"
          test -n "$SETUP"
          ASSET_DIR="$(dirname "$SETUP")"
          mkdir -p release
          cp "$ASSET_DIR/SIP-Fehleranalyse-v1.6.8-Setup.exe" release/
          cp "$ASSET_DIR/SIP-Fehleranalyse-v1.6.8-Portable.zip" release/
          cp "$ASSET_DIR/RELEASE-NOTES-v1.6.8.txt" release/
          cp "$ASSET_DIR/update-manifest.json" release/
          cp "$ASSET_DIR/update-manifest.sig" release/
          cp "$ASSET_DIR/SHA256SUMS.txt" release/
          test -s release/SIP-Fehleranalyse-v1.6.8-Setup.exe
          test -s release/SIP-Fehleranalyse-v1.6.8-Portable.zip
          test -s release/RELEASE-NOTES-v1.6.8.txt
          test -s release/update-manifest.json
          test -s release/update-manifest.sig
          test -s release/SHA256SUMS.txt
          (cd release && sha256sum -c SHA256SUMS.txt)
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('release/update-manifest.json').read_text(encoding='utf-8-sig'))
          assert data['schemaVersion'] == 1
          assert data['product'] == 'SIP-Fehleranalyse'
          assert data['appVersion'] == '1.6.8'
          assert data['installer']['fileName'] == 'SIP-Fehleranalyse-v1.6.8-Setup.exe'
          assert data['portable']['fileName'] == 'SIP-Fehleranalyse-v1.6.8-Portable.zip'
          PY

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v1.6.8 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release v1.6.8 already exists; refusing to overwrite it."
            exit 1
          fi
          gh release create v1.6.8 \
            --repo "$GITHUB_REPOSITORY" \
            --target main \
            --title "SIP-Fehleranalyse v1.6.8" \
            --notes-file release/RELEASE-NOTES-v1.6.8.txt \
            --latest \
            release/SIP-Fehleranalyse-v1.6.8-Setup.exe \
            release/SIP-Fehleranalyse-v1.6.8-Portable.zip \
            release/RELEASE-NOTES-v1.6.8.txt \
            release/update-manifest.json \
            release/update-manifest.sig \
            release/SHA256SUMS.txt
